kind = "web"
previewPath = "/"
title = "Book Manager"
version = "1.0.0"
id = "artifacts/book-manager"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21372

[services.development]
run = "pnpm --filter @workspace/book-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/book-manager", "run", "build" ]
publicDir = "artifacts/book-manager/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21372"
BASE_PATH = "/"
